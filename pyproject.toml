[project]
name = "nutti"
version = "0.1.0"
description = "Nutti — 애견 수제간식 AI 광고/콘텐츠 자동화 파이프라인"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "structlog>=24.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "gspread>=6.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "PyYAML>=6.0",
]

[project.scripts]
nutti = "nutti.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# ruff 0.16 부터 기본 규칙 집합이 넓어져 CI 가 깨졌다. 이 프로젝트가 써 온 옛 기본값(E4·E7·E9·F)을 명시한다.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
