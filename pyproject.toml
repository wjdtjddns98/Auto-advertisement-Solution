[project]
name = "nutti"
version = "0.1.0"
description = "Nutti — 애견 수제간식 AI 광고/콘텐츠 자동화 파이프라인"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "structlog>=24.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "gspread>=6.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # ponytail: 상한 핀 — 미핀 시 CI가 최신 ruff를 받아 신규 기본 규칙으로 갑자기 red(2026-07-28 65건).
    # 규칙 신규분을 적용하려면 상한을 올리고 그때 한 번에 정리할 것.
    "ruff>=0.4,<0.16",
    "mypy>=1.10",
    "PyYAML>=6.0",
]

[project.scripts]
nutti = "nutti.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
